    <div class="header">

      <div class="card">
        <div class="card-inner">
          <div class="card-front"></div>
          <div class="card-back">B</div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front"></div>
          <div class="card-back">A</div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front"></div>
          <div class="card-back">B</div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front"></div>
          <div class="card-back">C</div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front"></div>
          <div class="card-back">C</div>
        </div>
      </div>
    </div>
    

    <div class="win-message-container">
      <h2 class="win-message">You Won!</h2>
      <button class="start-over-btn">Start Over!</button>
    </div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
